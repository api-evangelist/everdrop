aid: everdrop
name: Everdrop
description: 'Everdrop is a Munich-based direct-to-consumer sustainability brand, founded in 2019, that
  sells more sustainable everyday household products — cleaning tabs, laundry detergent, dishwasher tablets,
  washing-up liquid and natural body care — designed around a refill model of concentrated tabs/powders
  dissolved in reusable bottles to cut single-use plastic, unnecessary chemicals and CO2. The company
  operates an e-commerce storefront (Shopify/Next.js/Storyblok stack) with a subscription-based refill
  program, and reports certifications including B Corp, EU Ecolabel and Ecocert. It has no public developer
  or API program; this profile was surfaced as an HV Capital portfolio company and enriched from Everdrop''s
  public web surface.'
